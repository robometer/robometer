# Evaluation Configuration for RBM (Robometer)
# This config is used specifically for evaluation runs

# Model path to load training config from
model_path: "robometer/Robometer-4B"  # or your RBM/ReWiND checkpoint

# GPU Pool settings
num_gpus: 1  # Number of GPUs to use (null for all available)
max_workers: 8 # Max worker threads (null for auto, typically same as num_gpus)

# Evaluation parameters
batch_size: 4  # Batch size for evaluation
server_url: "0.0.0.0"  # Evaluation server URL
server_port: 8000  # Evaluation server port

# Cap long / high-res client videos before the collator (see robometer.evals.eval_sample_normalize)
eval_max_input_frames: 50   # 0 = no temporal cap
eval_resize_frames: true
eval_max_image_side: 480
eval_max_image_pixels: 1048576
